name: Flutter Nightly Build

on:
  # Fontis: cron nocturno desactivado para no gastar minutos de Actions.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
